name: Download Instagram Reels to Repo

on:
  workflow_dispatch:
    inputs:
      reel_url:
        description: 'Instagram reel URL to download'
        required: true

jobs:
  download_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Use the default GITHUB_TOKEN for checkout

      - name: Install yt-dlp
        run: |
          sudo apt update
          sudo apt install -y yt-dlp

      - name: Create downloads directory
        run: mkdir -p downloads

      - name: Download reel
        run: |
          yt-dlp "${{ github.event.inputs.reel_url }}" -o "downloads/%(title)s.%(ext)s"

      - name: Commit and push new reel
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are new files in downloads directory
          if [ -n "$(ls -A downloads)" ]; then
            git add downloads/
            git commit -m "Add new downloaded reel: $(date +%Y-%m-%d_%H:%M:%S)"
            git push
          else
            echo "No new reels downloaded or found."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is used for pushing back to the repo
